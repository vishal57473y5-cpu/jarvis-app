name: Build JARVIS APK

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.24.0"
          channel: stable
          cache: true

      - name: Check Flutter
        run: |
          flutter --version
          flutter doctor -v

      - name: Create fresh Flutter Android project
        run: |
          flutter create \
            --org com.jarvis \
            --project-name jarvis_app \
            --platforms android \
            scaffold

      - name: Copy app code
        run: |
          cp pubspec.yaml scaffold/pubspec.yaml
          rm -rf scaffold/lib
          cp -r lib scaffold/lib

      - name: Fix dependency versions
        working-directory: scaffold
        run: |
          cat >> pubspec.yaml <<'EOF'

          dependency_overrides:
            geolocator_android: 4.6.1
            speech_to_text: 7.3.0
          EOF

      - name: Configure Android SDK 36
        working-directory: scaffold
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("android/app/build.gradle")
          content = path.read_text()

          replacements = {
              "compileSdk flutter.compileSdkVersion": "compileSdk 36",
              "compileSdkVersion flutter.compileSdkVersion": "compileSdkVersion 36",
              "targetSdk flutter.targetSdkVersion": "targetSdk 36",
              "targetSdkVersion flutter.targetSdkVersion": "targetSdkVersion 36",
              "minSdk flutter.minSdkVersion": "minSdk 21",
              "minSdkVersion flutter.minSdkVersion": "minSdkVersion 21",
          }

          for old, new in replacements.items():
              content = content.replace(old, new)

          path.write_text(content)

          print("Android SDK configuration completed.")
          PY

      - name: Install Android SDK 36
        run: |
          yes | ${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager --licenses || true

          ${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager \
            "platforms;android-36" \
            "build-tools;36.0.0"

      - name: Get Flutter packages
        working-directory: scaffold
        run: |
          flutter pub get

      - name: Verify dependency versions
        working-directory: scaffold
        run: |
          echo "Checking installed packages..."
          flutter pub deps | grep -E \
            "speech_to_text|geolocator_android|flutter_tts" || true

      - name: Add Android permissions
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          path = Path(
              "scaffold/android/app/src/main/AndroidManifest.xml"
          )

          content = path.read_text()

          permissions = [
              "android.permission.INTERNET",
              "android.permission.RECORD_AUDIO",
              "android.permission.POST_NOTIFICATIONS",
              "android.permission.ACCESS_FINE_LOCATION",
              "android.permission.ACCESS_COARSE_LOCATION"
          ]

          for permission in permissions:

              line = (
                  f'    <uses-permission '
                  f'android:name="{permission}"/>'
              )

              if permission not in content:
                  content = re.sub(
                      r'(<manifest[^>]*>)',
                      r'\1\n' + line,
                      content,
                      count=1
                  )

          path.write_text(content)

          print("Android permissions added successfully.")
          PY

      - name: Clean Flutter
        working-directory: scaffold
        run: |
          flutter clean

      - name: Get packages again
        working-directory: scaffold
        run: |
          flutter pub get

      - name: Build release APK
        working-directory: scaffold
        run: |
          flutter build apk --release

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: jarvis-apk
          path: scaffold/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
