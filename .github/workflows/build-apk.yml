name: Build JARVIS APK

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.24.0"
          channel: stable
          cache: true

      - name: Check Flutter
        run: |
          flutter --version
          flutter doctor -v

      - name: Create fresh Flutter Android project
        run: |
          flutter create \
            --org com.jarvis \
            --project-name jarvis_app \
            --platforms android \
            scaffold

      - name: Copy app code and pubspec
        run: |
          cp pubspec.yaml scaffold/pubspec.yaml

          rm -rf scaffold/lib
          cp -r lib scaffold/lib

      # IMPORTANT:
      # geolocator_android 4.6.2 has compatibility problems
      # with Flutter 3.24.x. Force 4.6.1.
      - name: Fix dependency versions
        working-directory: scaffold
        run: |
          cat >> pubspec.yaml <<'EOF'

          dependency_overrides:
            geolocator_android: 4.6.1
          EOF

      - name: Configure Android SDK 36
        working-directory: scaffold
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          path = Path("android/app/build.gradle")
          content = path.read_text()

          # compile SDK
          content = re.sub(
              r'compileSdk\s+flutter\.compileSdkVersion',
              'compileSdk 36',
              content
          )

          content = re.sub(
              r'compileSdkVersion\s+flutter\.compileSdkVersion',
              'compileSdkVersion 36',
              content
          )

          # target SDK
          content = re.sub(
              r'targetSdk\s+flutter\.targetSdkVersion',
              'targetSdk 36',
              content
          )

          content = re.sub(
              r'targetSdkVersion\s+flutter\.targetSdkVersion',
              'targetSdkVersion 36',
              content
          )

          # Minimum Android version
          content = re.sub(
              r'minSdk\s+flutter\.minSdkVersion',
              'minSdk 21',
              content
          )

          content = re.sub(
              r'minSdkVersion\s+flutter\.minSdkVersion',
              'minSdkVersion 21',
              content
          )

          path.write_text(content)

          print("Android SDK configuration updated")
          PY

      - name: Install Android SDK 36
        run: |
          yes | ${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager --licenses || true
          ${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager \
            "platforms;android-36" \
            "build-tools;36.0.0"

      - name: Add Android permissions
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          path = Path(
              "scaffold/android/app/src/main/AndroidManifest.xml"
          )

          content = path.read_text()

          permissions = [
              "android.permission.INTERNET",
              "android.permission.RECORD_AUDIO",
              "android.permission.POST_NOTIFICATIONS",
              "android.permission.ACCESS_FINE_LOCATION",
              "android.permission.ACCESS_COARSE_LOCATION",
          ]

          for permission in permissions:
              line = f'    <uses-permission android:name="{permission}"/>'

              if permission not in content:
                  content = re.sub(
                      r'(<manifest[^>]*>)',
                      r'\1\n' + line,
                      content,
                      count=1
                  )

          path.write_text(content)

          print("Permissions added successfully")
          PY

      - name: Clean project
        working-directory: scaffold
        run: |
          flutter clean

      - name: Get packages
        working-directory: scaffold
        run: |
          flutter pub get

      - name: Verify dependencies
        working-directory: scaffold
        run: |
          flutter pub deps

      - name: Build release APK
        working-directory: scaffold
        run: |
          flutter build apk --release

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: jarvis-apk
          path: scaffold/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
